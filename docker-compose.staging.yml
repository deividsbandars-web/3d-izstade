services:
  redis-staging:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    expose:
      - "6379"
    restart: unless-stopped
    networks:
      - default

  backend-staging:
    build:
      context: .
      dockerfile: backend-server/Dockerfile.full
    environment:
      NODE_ENV: production
      PORT: 3001
      PIXEL_STREAMING_ROUTES_ENABLED: ${PIXEL_STREAMING_ROUTES_ENABLED:-false}
      SIGNALING_STATUS_BASE_URL: ${SIGNALING_STATUS_BASE_URL:-http://signaling-staging}
      PIXEL_STREAMING_STATUS_TIMEOUT_MS: ${PIXEL_STREAMING_STATUS_TIMEOUT_MS:-2500}
      REDIS_URL: redis://redis-staging:6379
      SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL is required}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?SUPABASE_ANON_KEY is required}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:?SUPABASE_SERVICE_KEY is required}
      UE5_SECRET_KEY: ${UE5_SECRET_KEY:-}
      APP_ENV: ${APP_ENV:-staging}
      MODULAR_HOME_QUOTE_SUBMISSION_ENABLED: ${MODULAR_HOME_QUOTE_SUBMISSION_ENABLED:-false}
      MODULAR_HOME_QUOTE_STAGING_HOSTS: ${MODULAR_HOME_QUOTE_STAGING_HOSTS:-staging.30sek24.com,api-staging.30sek24.com,localhost,127.0.0.1}
      MODULAR_HOME_QUOTE_EMAIL_HANDOFF_ENABLED: ${MODULAR_HOME_QUOTE_EMAIL_HANDOFF_ENABLED:-false}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      BILLING_CHECKOUT_SUCCESS_URL: ${BILLING_CHECKOUT_SUCCESS_URL:-}
      BILLING_CHECKOUT_CANCEL_URL: ${BILLING_CHECKOUT_CANCEL_URL:-}
      BILLING_PUBLIC_APP_URL: ${BILLING_PUBLIC_APP_URL:-}
    ports:
      - "3001:3001"
    depends_on:
      redis-staging:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    networks:
      - default

  signaling-staging:
    build:
      context: ./deployment/signaling
      dockerfile: Dockerfile
    environment:
      STUN_SERVER_URLS: ${STUN_SERVER_URLS:-stun:stun.l.google.com:19302}
      TURN_SERVER_URLS: ${TURN_SERVER_URLS:?TURN_SERVER_URLS is required}
      TURN_USERNAME: ${TURN_USERNAME:?TURN_USERNAME is required}
      TURN_PASSWORD: ${TURN_PASSWORD:?TURN_PASSWORD is required}
    expose:
      - "80"
    ports:
      - "127.0.0.1:8081:80"
      - "9888:8888"
      - "9889:8889"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/api/status >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    networks:
      - default

networks:
  default:
    name: warpala-staging-network
