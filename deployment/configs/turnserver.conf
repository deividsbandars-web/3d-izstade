# Coturn base configuration for Warpala Pixel Streaming.
# Internet-facing values such as realm, external IP and credentials are injected
# at runtime via docker-compose environment variables. Do not hardcode secrets here.
listening-port=3478
tls-listening-port=5349

# Authentication / protocol
fingerprint
lt-cred-mech

# Keep the service lightweight and deterministic for the Pixel Streaming relay role.
no-cli
no-multicast-peers
stale-nonce=600
min-port=49260
max-port=49279

# Logs
simple-log
