version: '3.8'

services:
  # 1. Frontend (Vite SPA)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    environment:
      - VITE_API_URL=http://localhost:3000
      - VITE_WS_URL=ws://localhost:8888
    depends_on:
      - backend
      - sync-server

  # 2. Main API Backend
  backend:
    build:
      context: ./backend-server
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_ANON_KEY}
    restart: always

  # 3. Real-time Sync Server (WebSockets)
  sync-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "8888:8888"
    environment:
      - PORT=8888
    restart: always

networks:
  default:
    name: warpala-network
