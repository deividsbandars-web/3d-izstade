services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_PUBLIC_API_BASE_URL: ${VITE_PUBLIC_API_BASE_URL:?VITE_PUBLIC_API_BASE_URL is required}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?VITE_SUPABASE_URL is required}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:?VITE_SUPABASE_ANON_KEY is required}
        VITE_PUBLIC_APP_URL: ${VITE_PUBLIC_APP_URL:-}
        VITE_SIGNALING_SERVER_URL: ${VITE_SIGNALING_SERVER_URL:-}
        VITE_PIXEL_STREAMING_PROBE_TIMEOUT_MS: ${VITE_PIXEL_STREAMING_PROBE_TIMEOUT_MS:-}
        VITE_STUN_SERVER_URLS: ${VITE_STUN_SERVER_URLS:-}
        VITE_TURN_SERVER_URLS: ${VITE_TURN_SERVER_URLS:-}
        VITE_TURN_USERNAME: ${VITE_TURN_USERNAME:-}
        VITE_TURN_PASSWORD: ${VITE_TURN_PASSWORD:-}
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    expose:
      - "6379"
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend-server/Dockerfile.full
    environment:
      NODE_ENV: production
      PORT: 3000
      PIXEL_STREAMING_ROUTES_ENABLED: ${PIXEL_STREAMING_ROUTES_ENABLED:-false}
      SIGNALING_STATUS_BASE_URL: ${SIGNALING_STATUS_BASE_URL:-}
      PIXEL_STREAMING_STATUS_TIMEOUT_MS: ${PIXEL_STREAMING_STATUS_TIMEOUT_MS:-2500}
      REDIS_URL: redis://redis:6379
      SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL is required}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?SUPABASE_ANON_KEY is required}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:?SUPABASE_SERVICE_KEY is required}
      UE5_SECRET_KEY: ${UE5_SECRET_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

networks:
  default:
    name: warpala-network
