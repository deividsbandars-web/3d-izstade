services:
  backend:
    build: ../../apps/backend
    ports:
      - "3001:3001"
    environment:
      - REDIS_URL=redis://redis:6379
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
    depends_on:
      - redis

  signaling:
    build: ../../apps/signaling
    ports:
      - "8888:8888"
      - "80:80"
    command: ["node", "./dist/index.js", "--serve", "--http_port", "80", "--player_port", "8888"]

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  coturn:
    image: coturn/coturn
    ports:
      - "3478:3478"
      - "3478:3478/udp"
    volumes:
      - ../coturn/turnserver.conf:/etc/coturn/turnserver.conf

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend
      - signaling
